[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-skillbridge"
version = "1.0.0"
description = "Hermes <-> DeepSeek Harness skill bridge: convert skills both ways through the shared ~/.agents/skills root"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "1liu470" }]
keywords = ["hermes", "deepseek", "dsh", "skills", "agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
yaml = ["PyYAML>=5.1"]

[project.scripts]
skillbridge = "skillbridge.cli:main"

[project.urls]
Homepage = "https://github.com/1liu470/dsh-skillbridge"

[tool.setuptools]
packages = ["skillbridge"]
